<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nikkah Invitation</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #0b0b12;
  overflow: hidden;
  font-family: 'Georgia', serif;
}

.wrapper {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 0;
}

.wrapper img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.welcome {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  text-align: center;
  color: #fff;
}

.welcome.hide {
  opacity: 0;
  pointer-events: none;
  transform: translateY(-20px);
  transition: opacity 1.2s, transform 1.2s;
}

#welcome h2 {
  font-size: 3rem;
  margin-top: 20px;
  color: #ffd700;
  text-shadow: 0 0 8px #ffd700, 0 0 16px #ffd700;
  animation: glow 1s ease-in-out infinite;
}

@keyframes glow {
  0%,100%{text-shadow:0 0 8px #ffd700,0 0 16px #ffd700;opacity:1;transform:scale(1);}
  50%{text-shadow:0 0 20px #ffd700,0 0 40px #ffd700;opacity:0.8;transform:scale(1.2);}
}

.invite {
  position: fixed;
  inset: 0;
  z-index: 3;
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  transition: opacity 1.5s ease;
}

.invite.show { opacity: 1; }

.tap-area {
  position: absolute;
  border-radius: 12px;
}

.tap-area::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: 0 0 0 rgba(255,215,0,0);
  transition: box-shadow 0.3s ease;
}

.tap-area:active::after { box-shadow: 0 0 25px rgba(255,215,0,0.7); }
</style>
</head>
<body>

<div class="wrapper">
  <img src="invite.png" alt="Nikkah Invitation">
</div>

<div class="welcome" id="welcome">
  <div>
    <h1>Welcome 🤍</h1>
    <p>We are honored to invite you<br>to a blessed Nikkah</p>
    <h2 id="countdown">3</h2>
  </div>
</div>

<div class="invite" id="invite">
  <a class="tap-area" href="https://maps.app.goo.gl/W4qrqwgUnyN2P6y69" target="_blank"
     style="bottom:18%; left:10%; width:80%; height:6%;"></a>
  <a class="tap-area" href="event.ics"
     style="bottom:6%; left:20%; width:60%; height:7%;"></a>
</div>

<!-- Include canvas-confetti library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

<script>
// Countdown
let countdown = 3;
const countdownEl = document.getElementById('countdown');

const interval = setInterval(()=>{
  countdown--;
  if(countdown>0){
    countdownEl.textContent = countdown;
  } else {
    clearInterval(interval);
    document.getElementById('welcome').classList.add('hide');
    setTimeout(()=>{
      document.getElementById('invite').classList.add('show');
    },400);
    startConfetti();
  }
},1000);

// Confetti function
function startConfetti(){
  const duration = 15 * 1000;
  const animationEnd = Date.now() + duration;
  const colors = ['#ffd700','#ff3c00','#00aaff','#ff00ff','#32cd32','#ff4500','#1e90ff','#ff1493'];
  const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 2, colors: colors };

  function randomInRange(min,max){ return Math.random()*(max-min)+min; }

  const interval = setInterval(function(){
    const timeLeft = animationEnd - Date.now();
    if(timeLeft <=0){ clearInterval(interval); return; }

    const particleCount = 50 * (timeLeft / duration);

    confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.1,0.3), y: Math.random()-0.2 } });
    confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.7,0.9), y: Math.random()-0.2 } });
  },250);
}
</script>

</body>
</html>
